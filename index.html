<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf3e6">

<title>Tiệm Trà Nhỏ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  html,body{margin:0;height:100%;background:#fbf3e6}
  main{height:100vh;height:100dvh;display:flex;align-items:center;justify-content:center}
  img{max-width:100%;max-height:100%;object-fit:contain;display:block}
</style>
</head>
<body>
<main><img src="dong-cua.jpg" alt="Tiệm Trà Nhỏ đã đóng cửa. Hẹn gặp lại quý khách."></main>
<script>
// gỡ bản game đã lưu trên máy (service worker và bộ nhớ đệm)
(async()=>{try{if('serviceWorker'in navigator){const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs){await r.update().catch(()=>{});}}
  if(window.caches){for(const k of await caches.keys())await caches.delete(k)}}catch(e){}})();
</script>
</body>
</html>
